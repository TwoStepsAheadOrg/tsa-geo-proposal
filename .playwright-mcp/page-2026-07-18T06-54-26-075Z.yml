                  - text: 🤦‍♀️하지만 고인물의 입맛에 맞게 개발된 제품이었기 때문일까요. 착용감이라는 확실한 장점은 잡았지만, 더 많은 사용자를 만나 뵙기 위해서는 고려해야 할 것이 더 많다는 사실을 깨달았어요.
