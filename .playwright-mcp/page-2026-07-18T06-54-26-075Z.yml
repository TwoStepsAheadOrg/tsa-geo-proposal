              - 'button "안 피곤해도 다크서클 있는사람!! 오늘따라 왜 이렇게 피곤해보이냐는 말 듣고 살았던 사람, 저예요.. 시술, 눈밑타투, 컨실러, 아이크림 안 알아본 게 없을 정도로 심각했던… 🐼 근데 알고 보니 다크서클은 색 때문만이 아니라 눈 밑이 나이먹고 꺼져서 더 퀭해 보이는 거래요ㅠㅠ! 시술은 무섭고, 그래서 요즘 난리라는 YC칼슘크림 협찬으로 한달정도 매일 발라주다 보니 눈밑이 서서히 차오르는 느낌이 들더라구요..0o0 초고농도 칼슘이 700,000ppm이나 함유되어있다고해서 더 기대했는데 사용해보니 인기 많은 이유가 있었어요ㅋㅋㅋ! 피부과 납품용 제품이라 내내 품절이다가…드디어 재입고 떴다고 해요!! 이번 1+1 특가 절대 놓치지 말기! 📌 댓글 이벤트 댓글에 “눈밑” 적어주시면 추첨 10분께 YC칼슘크림 본품 증정 🎁 (구매는 프로필 하이라이트를 확인해주세요!) #플라링크 #YC칼슘크림 #눈밑꺼짐 #다크서클 #인스타툰" [ref=f1e1291]':
