                - button "와... 인스타툰 0원 강의 열렸다..!!😲 . . . 안녕하세요! 13년차 캐릭터 디자인 전문가 뇽쏘툰 작가 뇽입니다 그림 실력이 나빠서, 회사를 다니느라 시간이 없어서, 많은 분들이 인스타툰 연재를 망설이거나 중간에 포기하곤 합니다. 저 역시 처음 인스타툰을 시작했을 때, 낮에는 직장을 다니고, 밤에는 눈을 비비며 그림을 그리곤 했죠. 하지만 4년간의 인스타툰 연재 경험 속에서 자투리 시간을 효율적으로 활용하는 노하우를 터득했고, 지금은 인스타툰 하나로 매달 꾸준한 수익을 내고 있습니다. 무작정 인스타툰을 시작했다가 비효율적인 과정으로 인해 지쳐서 그만두는 분들을 정말 많이 봤습니다. 사실 인스타툰은 그림 실력이 중요한 컨텐츠는 아니예요. 일반적인 웹툰과 인스타툰의 차이만 이해한다면, 회사를 다니면서도 훨씬 더 효율적으로 인스타툰을 연재하고, 반응을 얻어내실 수 있습니다. 이 강의는 단순히 인스타툰을 그리는 강의가 아닙니다. 평범한 회사원이었던 제가 지난 4년간 직접 겪었던 시행착오를 이 강의에 압축해 담았습니다. 인스타툰 부업을 포기하지 꾸준히 이어나갈 수 있는 방법, 짧은 시간으로도 팬과 수익을 만드는 루틴까지 전부 실현 가능한 현실적인 방법을 알려드릴겁니다. 여러분들은 저와 같은 시행착오를 거치지 않고 바로 인스타툰에 도전할 수 있도록 성심성의껏 도와드릴게요. 그럼 강의실에서 만나 뵙겠습니다." [ref=f1e6221]:
