                  - text: 🦸‍♀️스토어 평점 ⭐️4.9
                  - text: 2달만에 누적 4억원 모금!
                  - text: "생리컵 명가 {오이사}의 대표 생리컵, 오이사 벨은 이미 수만명의 간증이 쏟아지는 핫한 생리컵이예요."
                  - text: "모두가 첫 생리컵으로 {오이사 벨}을 선택하죠."
                  - text: 1️⃣최고급 독일제 의료용 실리콘 사용
                  - text: 2️⃣의료기기 전문 제조사에서 국내 생산
                  - text: 3️⃣식약처 정식 품목허가 취득
                  - text: 4️⃣안전성테스트 및 생체적합테스트 통과
                  - text: 5️⃣관련 특허 8건
                  - text: 벨과 함께라면 축축하고 꿉꿉한 생리대를 착용하지 않아도 월경기간을 보낼 수 있답니다.
                  - text: ✅️생리컵 1개로 2년동안 사용 가능
                  - text: ✅️생리대값도 안들고, 환경적이기까지!
                  - text: ✅️화장실 쓰레기통을 없앨 수 있어요
                  - text: 먹고 바르는 그 어떤 건강보조제보다, 생리컵 하나로 즉각 바뀌는 삶의 질을 경험해보셨으면 좋겠어요.
                  - text: "이것저것 복잡하게 알아보고 비교해볼 필요 없도록, {오이사 벨}은 쉬운 사용설명서와 자세한 가이드를 함께 발송드리고 있으니 안심하시구요☺️"
