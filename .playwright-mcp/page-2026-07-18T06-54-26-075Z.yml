                    - text: 무작정 인스타툰을 시작했다가 비효율적인 과정으로 인해
                    - text: 지쳐서 그만두는 분들을 정말 많이 봤습니다.
                    - text: 사실 인스타툰은 그림 실력이 중요한 컨텐츠는 아니예요.
                    - text: 일반적인 웹툰과 인스타툰의 차이만 이해한다면,
                    - text: 회사를 다니면서도 훨씬 더 효율적으로
                    - text: 인스타툰을 연재하고, 반응을 얻어내실 수 있습니다.
                    - text: 이 강의는 단순히 인스타툰을 그리는 강의가 아닙니다.
                    - text: 평범한 회사원이었던 제가 지난 4년간 직접 겪었던
                    - text: 시행착오를 이 강의에 압축해 담았습니다.
                    - text: 인스타툰 부업을 포기하지 꾸준히 이어나갈 수 있는 방법,
                    - text: 짧은 시간으로도 팬과 수익을 만드는 루틴까지
                    - text: 전부 실현 가능한 현실적인 방법을 알려드릴겁니다.
                    - text: 여러분들은 저와 같은 시행착오를 거치지 않고
                    - text: 바로 인스타툰에 도전할 수 있도록 성심성의껏 도와드릴게요.
                    - text: 그럼 강의실에서 만나 뵙겠습니다.
