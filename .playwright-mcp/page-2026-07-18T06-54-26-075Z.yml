                  - text: 한국에서는 생리컵이 판매된지 10년도 안됐어요. 짧은 역사를 가진 만큼, 종류도 부족하고 가짓수도 몇 개 없었죠.
                  - text: 그래서 일찌감치 생리컵 좋은거 알고있던 여성 전문가들이 모여서, 6년간 생리컵 개발에만 몰두하는 브랜드가 되었어요.
