                  - text: 🚨(충격)생리컵 만드는 방법...
                  - text: 이전화/다음화는 피드에❕️
                  - text: 뭐 하나 여쭤볼게요.
                  - text: 생리컵 쓰시나요?
                  - text: 안쓰신다면 왜 안쓰세요?
                  - text: "\"무서워서요\""
                  - text: "\"알아볼 게 많던데..복잡해요\"🤦‍♀️"
                  - text: 대부분의 여성분들이 이렇게 말씀해주시더라고요. 좋다좋다 하던데, 막상 알아볼 엄두는 안나고 그러셨던 것 같아요.
                  - text: 그도 그럴것이 기존의 생리컵은 사람마다 잘 맞고 안맞고 다르고 복불복 느낌이 좀 있었어요.
                  - text: 사람마다 질 길이도 다르고, 질 근육의 텐션도 다르기 때문이죠. 그래서 나에게 잘 맞는 생리컵을 찾아 헤매는 유목민이 정말 많았어요.
                  - text: 이른바 '골든컵'을 찾기 위해 손가락을 질에 넣어서 질 길이를 대충 재보기도 하고, 수많은 블로그 후기를 돌아다니며 다양한 생리컵을 비교했어야 했죠. 이게 몇천원짜리도 아니고, 2~3만원 짜리니까 신중하게 선택하게 되잖아요?
                  - text: 이렇게 높은 진입장벽 때문에 힘드셨을 거예요. 저희는 바로 이 부분 때문에 고민이 많았어요.
                  - text: "'생리컵은 왜 어려운 걸까?'"
                  - text: 다시 시작점으로 되돌아가 본질적인 문제의 해답을 찾아보기로 했어요.
                  - text: 이를 위해 수많은 고객인터뷰와 온갖 제품의 상품 후기, SNS, 커뮤니티의 게시글을 모아 분석했죠.
                  - text: 국내외 다양한 생리컵 제품들을 모아 제품의 좋은 점과 아쉬운 점도 연구해 보았습니다. 이 과정에서 형태와 재질 등에 대한 힌트를 얻었고, 마침내 생리컵이 여전히 어렵게 느껴지는 원인에 대해 나름의 정의를 내릴 수 있었어요.
                  - text: <생리컵이 어렵게 느껴졌던 이유>
                  - text: ✴️구매 전부터 공부할 게 많음
                  - text: ✴️뭐가 잘맞을 지 모르겠다, 사이즈 선택 어려움
                  - text: ✴️샐까봐 걱정됨, 밖에선 도대체 어떻게 하지?
                  - text: ✴️혹시 못빼면 어떡하지?
                  - text: ✴️뭔가 불편할 것 같음
                  - text: ✴️실패 후기를 보고 무서워짐
                  - text: 이렇게나 구체적인 어려움이 있는데, 이를 '막연한 두려움' 또는 '사용미숙'이라는 말로 퉁칠 수는 없다고 생각했어요.
                  - text: 이러한 한계를 제대로 해결하지 않고 개발한 제품은, 사용자에게 모름이라는 책무를 떠넘긴 것이라고 생각했습니다.
                  - text: ⭐어려움 없이 사용할 수 있어 쉽게 손이 가면서도 확실한 만족을 주는, 즉 사용자는 아무것도 몰라도 괜찮은 생리컵!
                  - text: 그것이 우리가 ‘기본을 갖췄다’고 정의하는 기준이었습니다.
                  - text: 그렇다면 이제 해야 할 일은 명확하죠.
                  - text: 이것저것 비교하며 알아볼 필요 없이 사용편차가 적어서 누구에게나 잘 맞고, 자잘한 불편함이 개선되어 '기본을 갖춘' 생리컵을 제작해야죠.
                  - text: .
                  - text: .
                  - text: .
                  - text: 그 다음부터는 일사천리였습니다. 형태적 연구를 통해 가능한 경우의 수를 모두 제작하고, 팀원들의 월경주기마다 하나하나 착용해 가며 테스트하기 시작했어요.
                  - text: (소중이에 불날때까지 테스트해준 우리 팀원들...미안하고...고맙읍니다...🤣)
                  - text: 하루하루 모든 에너지를 개발에 쏟아 넣었어요. 그 과정에서 94개의 모델을 디자인하고, 75개의 시제품을 만들어 직접 테스트했죠. 최종에 달하기까지 무려 150번의 수정이 있었습니다.
                  - text: ‼️ 그리고 마침내!
                  - text: 확신을 가지고 돌아왔습니다. 저희가 거쳐온 치열한 고민의 과정을 재미있게 개발툰으로 그려봤으니 다음화도 봐주시면 감사하겠습니다.🥰
                  - text: .
                  - text: .
