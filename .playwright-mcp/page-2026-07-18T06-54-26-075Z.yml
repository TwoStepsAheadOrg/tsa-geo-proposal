                  - text: "#광고"
                  - text: 출산보다 젖물리는 게 더 아프다고?😱
                  - text: 첫째 낳고 3일째 되던 날,
                  - text: 아기가 처음 젖을 물었을 때 너무 아파서 저도 모르게 울음이 터졌던 기억이 있어요 😭
                  - text: 출산도 힘들었지만, 유두에 상처가 나고 갈라졌을 땐 정말 감당하기 힘든 고통이었어요.
                  - text: 그때 알게 됐어요.
                  - text: ⭐️ 유두보호크림, 모유수유하는 엄마에게 꼭 필요한 생존템이라는 걸요.
                  - text: 👶🏻 그래서 둘째, 셋째 때부터는 무조건 이거였어요.
                  - text: ✨ 란시노 HPA 라놀린 크림 ✨
                  - text: ✔️ 영국·미국 아마존 1위, 전 세계 엄마들이 극찬💜
                  - text: ✔️ 100% HPA 라놀린 단일 성분, 저자극 테스트 완료
                  - text: ✔️ EWG GREEN 1등급 + 피부 자극 지수 0.0
                  - text: ✔️ 무향료, 무색소, 무방부제로 더 믿을 수 있어요
                  - text: 🍼 수유 전에 따로 닦아낼 필요 없이
                  - text: 신생아 입에 닿아도 안심할 수 있어서 참 편해요.
                  - text: 👩🏻‍🍼 “엄마 유두는 생각보다 많이 여려요.
                  - text: 수유 후엔 꼭 진정시켜 주세요.”
                  - text: 보습력도 뛰어나서
                  - text: 지금은 저도 아기와 함께 사용하고 있어요.
                  - text: 💧 아기 볼에 올라온 붉은기엔 살살~
                  - text: 💋 트고 갈라진 입술엔 꾹꾹~
                  - text: 🦶 팔꿈치나 발뒤꿈치 같은 건조 부위까지 촉촉하게!
                  - text: ‘크림 하나로 엄마, 아기, 온 가족 보습 끝!’
                  - text: 이제는 그냥 두고두고 찾게 되는 제품이 되었답니다.
                  - text: 👭 “출산 준비물 중에 진짜 꼭 챙겨야 할 거 있어?”
                  - text: 라고 묻는 친구에게 저는 꼭 추천드려요.
                  - text: 🎁 선물용 세트도 있어서 출산 선물로도 아주 좋아요. (카카오톡 선물하기로 편하게 선물 가능!💛)
                  - text: —
                  - text: 🎁 써보고 싶은 이유를 댓글로 남겨주시면, 선물로 라놀린 크림을 보내드립니다! (3명)
                  - text: ☕️ ‘구매완료 + 전화번호 뒤 네자리’ 댓글로 구매 인증 시 스타벅스 쿠폰도 보내드려요! (5명)
                  - text: 📦 구매는 하이라이트 링크 또는 프로필에서 확인하실 수 있어요.
                  - text: "🏷️ 할인 기간 : 6/30(월) ~ 7/6(일) ,"
                  - text: 오직 한나툰에서만 특가 진행 중입니다✨
                  - text: 짧은 특가를 절대 놓치지 마세요!💟
