                  - text: ✅️생리컵 1개로 2년동안 사용 가능
                  - text: ✅️생리대값도 안들고, 환경적이기까지!
                  - text: ✅️화장실 쓰레기통을 없앨 수 있어요
                  - text: 먹고 바르는 그 어떤 건강보조제보다, 생리컵 하나로 즉각 바뀌는 삶의 질을 경험해보셨으면 좋겠어요.
                  - text: "이것저것 복잡하게 알아보고 비교해볼 필요 없도록, {오이사 벨}은 쉬운 사용설명서와 자세한 가이드를 함께 발송드리고 있으니 안심하시구요☺️"
                  - text: DM이든 상담톡이든 모두 친절하게 응대해드리고 있으니, 궁금한 점이 있다면 언제든 문 두드려 주세요❗️❗️🤛
