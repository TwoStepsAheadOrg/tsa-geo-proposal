                - 'button "배우 황인엽과 조이현이 화제의 웹툰 원작 드라마 <바른연애 길잡이>의 주인공을 맡습니다. 두 사람은 현재 세부 일정을 조율하고 있는 단계로 알려졌습니다. 남수 작가의 동명 웹툰을 원작으로 한 <바른연애 길잡이>는 매일 계획을 세우며 바른 생활을 실천하지만 연애에는 초보인 ''정바름''이 연애에 도전하면서 펼쳐지는 이야기를 그립니다. 원작의 높은 인기에 힘입어 드라마 제작 착수 소식만으로도 화제를 모은 바 있습니다. 황인엽은 tvN <여신강림>, 넷플릭스 시리즈 <안나라 수마나라>와 같은 웹툰 원작의 드라마와 JTBC <조립식 가족> 등의 작품으로 꾸준히 역량을 증명해왔으며 강렬한 존재감을 드러내며 거침없는 대세 행보를 이어가고 있습니다. 조이현은 최근 tvN <견우와 선녀>에 출연하며 사랑스럽고도 인상 깊은 연기를 선보였으며, 넷플릭스 시리즈 <지금 우리 학교는>을 통해 국내외에서 많은 사랑을 받아왔습니다. <바른연애 길잡이>는 디즈니+ 시리즈 <무빙>, <조명가게> 등을 제작한 무빙픽쳐스컴퍼니가 제작을 맡을 예정이며, 편성은 미정입니다. *이미지 출처: 케이엔스튜디오, 아티스트컴퍼니" [ref=f4e1898]':
