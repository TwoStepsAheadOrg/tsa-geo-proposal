            - generic [ref=f14e169]: 회사 소개
            - generic [ref=f14e170]:
              - text: "'AI가 답을 만드는 시대'의 마케팅 데이터 인프라를 만드는 AI 테크 기업입니다. 서울 강남에 본사를 둔 법인으로, 자체 서비스를 직접 개발·운영하며 그 과정에서 검증된 기술로 클라이언트 프로젝트를 수행합니다."
              - text: 【운영 서비스】
              - text: ■ 플루랭크(Plurank) — GEO(생성형 엔진 최적화) 데이터 인프라
              - text: SEO가 구글 순위를 측정했다면, 플루랭크는 ChatGPT·Perplexity·Gemini·AI Overview 등 7개 AI 플랫폼이 '누구를 인용하는지'를 측정합니다. 12개국 현지 IP 기반 실브라우저 관측 인프라를 매주 가동하고, 3천만 건 이상의 발행-인용 데이터로 학습한 자체 예측 모델 '플루오라(Pluora)'가 콘텐츠 발행 전에 AI 인용 확률을 예측합니다(평균 예측 오차 8.6%). 현재 엔터프라이즈 GEO 컨설팅을 운영 중이며 SaaS로 확장하고 있습니다.
              - text: ■ 툰에이전트(ToonAgent) — 브랜드 콘텐츠 제작
              - text: 설명이 어려운 전문 서비스(병원·법률·세무 등)를 인스타툰/브랜드툰으로 풀어내는 제작 대행 서비스입니다. 브랜드 전용 캐릭터 개발부터 기획·작화·업로드 소재·광고 소재·숏폼 변환까지 원스톱으로 제공합니다.
              - text: ■ AI DX/자동화
              - text: 대규모 크롤링·데이터 파이프라인 구축, LLM 응용 서비스 개발, 마케팅 자동화 등 AI 기반 디지털 전환 프로젝트를 수행합니다.
              - text: 【실적】
              - text: 법인 설립 6개월 만에 누적 계약 2억 원 이상을 달성했으며, 엔터프라이즈 데이터 마케팅 에이전시, 강남 소재 의료기관 3곳, 글로벌 대기업 계열 AI 검색 검증 프로젝트, 전기차 충전 사업자, 인바운드 여행 플랫폼 등 15개 이상의 국내외 클라이언트와 협업했습니다. 미국·프랑스·일본 기업과의 글로벌 PoC도 진행 중입니다.
              - text: 【일하는 방식】
              - text: 대표가 직접 설계하고 개발하는 테크리드 체제로, 의사결정과 개발 사이에 간극이 없습니다. 문제 정의부터 데이터 검증, 배포·운영까지 끝까지 책임지는 것이 원칙입니다.
            - generic [ref=f14e171]: 주요 업무 분야 및 강점
            - generic [ref=f14e172]:
              - text: 【주요 업무 분야】
              - text: 1. GEO/AEO(AI 검색 최적화) — AI 답변 인용 측정·분석, 콘텐츠 전략 수립과 실행, 성과 리포팅
              - text: 2. 데이터 인프라 구축 — 12개국 분산 크롤링 인프라(수십 대 워커 무중단 운영), BigQuery·Aurora 기반 데이터 웨어하우스, 실시간 스트리밍 파이프라인
              - text: 3. AI 서비스 개발 — LLM 응용 서비스, 자체 예측 모델 학습·서빙, API/MCP 연동
              - text: 4. 브랜드 콘텐츠 제작 — 인스타툰·브랜드툰 기획/작화/운영, 숏폼(릴스·쇼츠) 변환, 광고 소재 제작
              - text: 5. 마케팅 자동화·AI DX — 리드 수집/트래킹, 광고 운영 자동화, 업무 프로세스 자동화
              - text: 【강점】
              - text: ■ 직접 운영으로 검증된 기술 — 외주만 수행하는 회사가 아니라, 같은 기술로 자체 서비스를 만들어 실제 매출을 내고 있습니다. 제안서가 아니라 운영 경험에서 나온 노하우를 제공합니다.
              - text: ■ AI 검색 데이터 자산 — 7개 AI 플랫폼 × 12개국 주간 관측, 3천만 건 이상의 인용 데이터. 감이 아니라 데이터로 GEO를 말합니다.
              - text: ■ 속도 — 대표 직접 개발 체제로 PoC까지 수 주 내 도달. 기획부터 배포까지 전 과정을 소수 정예로 압축 수행합니다.
              - text: ■ 규제 업종 경험 — 의료광고 심의 등 제약이 많은 업종(병원·법률)의 콘텐츠·마케팅 실무 경험을 보유하고 있습니다.
              - text: ■ 글로벌 실행력 — 12개국 관측 인프라 운영, 미국·프랑스·일본 파트너와 협력 진행 중입니다.
            - generic [ref=f14e173]: 직원 수
            - generic [ref=f14e174]: 4명
            - generic [ref=f14e175]: 회사 구성 및 인력소개
            - generic [ref=f14e176]:
              - text: ■ 대표/테크리드 1명 — 풀스택 개발자. 3회 창업과 3회 매각(EXIT) 경험. 12개국 분산 크롤링 인프라, 데이터 파이프라인, AI 예측 모델까지 직접 설계·구축했으며, 모든 프로젝트의 기술 총괄을 대표가 직접 맡습니다.
              - text: ■ COO 1명 — B2B 운영 8년. 스타트업 CSO로 시리즈 A·B 투자 유치를 이끈 경험. 프로젝트 관리와 클라이언트 커뮤니케이션을 담당합니다.
              - text: ■ 프로덕트 디자이너 1명 — UX/UI 12년 경력. 데이터 대시보드·SaaS 프로덕트 디자인 전문.
              - text: ■ 어드바이저 — 글로벌 전략 컨설팅펌 출신. 사업 전략 자문.
              - text: 브랜드툰/인스타툰 제작은 검증된 전문 작가 네트워크와의 협업 체제로 운영하여, 규모 대비 높은 제작 캐파를 유지합니다.
