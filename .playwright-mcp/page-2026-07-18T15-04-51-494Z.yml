                - text: "1) 프로젝트 소개: 강남 소재 의료기관 3곳(피부과·성형외과·한의원)의 병원 AI 검색 최적화(GEO) 프로젝트입니다. 외국인 환자가 '서울 피부과' 등을 생성형 AI에 물었을 때 병원이 인용되도록 다국어 가시성을 관리했습니다. 2) 작업 범위: 12개국 관측 인프라로 국가별 검색 패턴 차이 분석(일본·미국·대만·동남아 환자의 상이한 질문) → 진료과별 콘텐츠 전략 → 심의 리스크를 고려한 교육형 콘텐츠 우선. 3) 성과: 3개 병원 6개월 계약 + 자동갱신, 동시 운영. 4) 주안점: 의료광고 심의 제약 하에서 안전한 GEO 콘텐츠 설계 — 시술 효과 보장성 표현을 배제한 교육·브랜딩형 콘텐츠 중심."
