                  - text: "1) 프로젝트 소개: 전기차 충전 사업자 한솔엠에스의 AI 검색 가시성(GEO) 프로젝트입니다. 소비자가 ChatGPT·Perplexity 등 생성형 AI에 '전기차 충전' 관련 질문을 할 때 브랜드가 인용되도록 콘텐츠·데이터 전략을 설계·실행했습니다. 2) 작업 범위: 자체 플랫폼 '플루랭크'로 7개 AI 플랫폼×12개국 인용 현황 측정 → 경쟁사 대비 인용 격차 진단 → 발행 콘텐츠의 AI 인용 확률 예측(Pluora 모델) → 월간 성과 리포트. 3) 주안점: 전기차 충전은 신규·기술 카테고리라 AI 답변에서 정보 공백이 큼 — 이 공백을 선점하는 콘텐츠 우선순위를 데이터로 도출했습니다. 4) 성과: 12개월 GEO 운영 계약, 주간 인용 추적 기반 지속 최적화."
