                  - text: "1) 프로젝트 소개: 인바운드 관광 플랫폼 올댓아너스클럽(K-Trip ONE)과 진행한 관광 AI 가시성(TouriGEO) 프로젝트입니다. 외국인 관광객이 생성형 AI에 한국 여행을 물을 때 콘텐츠가 인용되는지 다국어로 측정·진단했습니다. 2) 작업 범위: 12개국 IP 기반으로 국가별 관광 검색 질문 차이 분석, TouriGEO Score 측정, 다국어 AI 가시성 데이터 공유(MOU 체결). 3) 성과: 한국관광공사 제18회 초기관광벤처 선정으로 이어진 협력 사례, 12개월 협력. 4) 주안점: 인바운드 관광 GEO 표준을 공동으로 정립하고, 국가별로 다른 관광 검색 패턴을 데이터로 규명."
