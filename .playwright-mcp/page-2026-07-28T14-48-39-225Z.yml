                  - text: "1) 프로젝트 소개: 전기차 충전 사업자 한솔엠에스를 위해, 충전기 설치→운영→결제·정산→유지보수 전 주기를 하나로 묶은 전기차 충전소 통합 관제·운영 SaaS 플랫폼을 기획·개발·운영했습니다. 전국 충전소를 실시간 모니터링·원격 제어하는 관제 대시보드를 중심으로 회원·충전소·매출·정산·현장 업무까지 한 곳에서 운영합니다. 2) 작업 범위: 서비스 기획부터 아키텍처 설계, 백엔드·프론트엔드·모바일 개발, OCPP 충전 프로토콜 연동, 결제·로밍 정산, AI 상담, 운영까지 전 과정 자체 수행. - 관리자 웹(React 19, 87개 화면·20여 개 운영 모듈) + 모바일 앱(React Native) + 현장 관리 앱(GPS·사진) + 24시간 AI 상담(Claude Tool Use) - API Gateway(NestJS, 43개 서버 모듈) · OCPP Gateway(WebSocket, 1.6J + 2.0.1 이중 운영) · MySQL Multi-AZ(멀티테넌트 격리) 3) 핵심 기능 - 실시간 충전 모니터링 & OCPP 원격 제어(SSE 실시간 갱신 — 원격 시작/정지·리셋·펌웨어 OTA·진단·일괄 작업) - 통합 결제 & 로밍 정산 자동화(NicePay·RF카드·선불·포인트, KECO/ME/서울시 로밍 100% 자동 정산, 비회원 QR 충전) - 회원·충전소·충전기·매출·오더·포인트·단가·계약·현장 업무를 아우르는 운영 관리 모듈 + 역할 기반 접근제어(RBAC) - Claude Tool Use 기반 24시간 AI 고객 상담 + 친환경 에너지 연계(태양광·ESS·V2G·VPP) 4) 주안점·성과 - 자체 구축(개발 12~24개월·초기 5억+) 대비 2주 내 운영 시작·초기 비용을 대폭 절감하는 구독형 SaaS로 제공 - 환경부 의무화(OCPP 2.0.1) 대비 1.6↔2.0.1 이중 운영 및 ISO 15118 Plug&Charge 지원 - 로밍 정산 완전 자동화로 수작업 제거, AI 상담으로 24시간 고객 응대 부담 절감"
