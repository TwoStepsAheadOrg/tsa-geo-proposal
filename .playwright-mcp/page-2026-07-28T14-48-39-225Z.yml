                - text: 1) 문제점 (충전 사업자의 과제) - 제조사마다 관리 인터페이스가 달라 충전기 통합 관리·원격 제어가 어렵고, 상태를 실시간으로 파악하지 못해 현장 방문이 잦았습니다. - 결제(PG·VAN·RF)와 로밍 정산을 개별 연동·수작업으로 처리해 미수금·정산 부담이 컸습니다. - 환경부 규제(KECO 연동, OCPP 2.0.1 전환) 대응과 24시간 고객 응대 인력 확보가 부담이었습니다. 2) 목표 - 설치→운영→정산→유지보수 전 주기를 하나로 묶은 올인원 충전 관제·운영 플랫폼 구축. - 자체 구축(12~24개월·5억+) 없이 신규 사업자도 2주 내 운영을 시작하는 구독형 SaaS 제공. 3) 주안점 - 실운영 환경에서 검증된 플랫폼을 멀티테넌트 SaaS로 설계해 빠른 온보딩과 안정 운영을 동시에 확보. - OCPP 1.6J↔2.0.1 이중 운영으로 규제 변화에 대비하고, 로밍 정산을 완전 자동화.
