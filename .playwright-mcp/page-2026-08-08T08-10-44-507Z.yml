                  - heading "Evaluations for the agentic world" [level=5] [ref=e413]
                  - generic [ref=e414]: Agentic AI brings new sources of uncertainty such as non-deterministic decision-making, multi-step actions across sensitive systems, tool failure modes, and hallucinations, which could all show up in workflows that matter. In regulated settings, questions like “How have you validated a non-deterministic system?” and “Can you guarantee that chained tools and multi-step logic will not do something surprising in a business-critical flow?” need to be answered. “We just tested it,” is not enough.
