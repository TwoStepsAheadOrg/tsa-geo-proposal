          - generic [ref=f43e153]: ■ 대표/테크리드 1명 — 풀스택 개발자. 3회 창업과 3회 매각(EXIT) 경험. 12개국 분산 크롤링 인프라, 데이터 파이프라인, AI 예측 모델까지 직접 설계·구축했으며, 모든 프로젝트의 기술 총괄을 대표가 직접 맡습니다.■ COO 1명 — B2B 운영 8년. 스타트업 CSO로 시리즈 A·B 투자 유치를 이끈 경험. 프로젝트 관리와 클라이언트 커뮤니케이션을 담당합니다.■ 프로덕트 디자이너 1명 — UX/UI 12년 경력. 데이터 대시보드·SaaS 프로덕트 디자인 전문.■ 어드바이저 — 글로벌 전략 컨설팅펌 출신. 사업 전략 자문.브랜드툰/인스타툰 제작은 검증된 전문 작가 네트워크와의 협업 체제로 운영하여, 규모 대비 높은 제작 캐파를 유지합니다.
