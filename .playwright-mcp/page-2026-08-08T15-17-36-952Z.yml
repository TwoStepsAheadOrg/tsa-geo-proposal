          - generic [ref=f43e146]: 회사 소개
          - generic [ref=f43e147]: 저희는 기업의 AI 전환(AX)과 디지털 전환(DX) 도입을 설계부터 구축·운영까지 함께하는 IT 기업입니다. 서울 강남에 본사를 둔 법인으로, 자체 AI 서비스를 직접 개발·운영하며 그 과정에서 검증한 기술로 클라이언트의 AX·DX·AICX를 실현합니다.【핵심 역량】■ AX (AI 전환) — 업무·제품에 생성형 AI를 실제로 이식LLM 응용 서비스 개발, RAG·자체 예측 AI 모델, 대규모 크롤링·데이터 파이프라인, 생성형 AI 검색 가시성(GEO)까지. 단순 '도구 도입'을 넘어 데이터로 성과가 나는 AI 전환을 설계·구현합니다.■ DX (디지털 전환) — 제품·플랫폼을 프론트부터 백엔드까지 구축전기차 충전소 통합 관제 SaaS(React 19·NestJS·OCPP 1.6/2.0.1 — 관리자 87개 화면·실시간 원격제어·결제/로밍 자동정산), 한국식품 이커머스 쇼핑몰, B2B 아웃리치·CRM 플랫폼, 모바일 앱까지 웹·앱·백엔드를 아우르는 풀스택 구축·운영.■ AICX (AI 고객경험) — 상담·응대·CS를 AI로 전환Claude Tool Use 기반 24시간 AI 상담, 실시간 STT·상담 자동요약·감정분석·금지어 감지, AI 캐릭터 대화 등 고객 접점을 AI로 자동화하는 AICX를 구현합니다.【자체 운영 서비스】 (개발력 검증)· 플루랭크(Plurank) — 생성형 AI 검색 가시성(GEO) 데이터 SaaS. 7개 AI 플랫폼×12개국 실측, 3천만 건+ 데이터로 학습한 자체 예측모델(플루오라, 평균 예측오차 8.6%).· 툰에이전트(ToonAgent) — 브랜드 인스타툰/웹툰 제작.· 레비타로 — AI 사주·타로 운세 & AI 캐릭터 대화 앱.【실적】법인 설립 6개월 만에 누적 계약 2억 원 이상 달성. 전기차 충전 사업자, 엔터프라이즈 데이터 마케팅, 강남 의료기관, 인바운드 관광 플랫폼, 글로벌 대기업 계열 등 15개 이상 국내외 클라이언트와 협업했으며 미국·프랑스·일본 글로벌 PoC도 진행 중입니다.【일하는 방식】대표가 직접 설계·개발하는 테크리드 체제로 의사결정과 개발 사이에 간극이 없습니다. 문제 정의부터 데이터 검증, 배포·운영까지 끝까지 책임지며, Claude Code 등 AI 코딩 도구를 프로덕션에 상시 활용하는 AI-native 팀입니다.
          - generic [ref=f43e148]: 주요 업무 분야 및 강점
          - generic [ref=f43e149]: 【주요 업무 분야】■ AX · AI 전환· LLM/생성형 AI 응용 서비스 개발, RAG·자체 예측 모델· 생성형 AI 검색 최적화(GEO/AEO) — AI 답변 인용 측정·개선· 대규모 크롤링·데이터 수집·파이프라인 구축■ DX · 디지털 전환· SaaS·플랫폼·이커머스·모바일 앱 풀스택 구축·운영· React·Next.js·TypeScript·NestJS·React Native 기반 프론트~백엔드~배포■ AICX · AI 고객경험· AI 상담봇(Claude Tool Use)·AI 캐릭터 대화· 실시간 STT·상담 자동요약·감정분석 등 CS 자동화【강점】· 자체 서비스로 검증한 실전 개발력 — 기획→개발→배포→운영 원스톱· 대표 테크리드가 직접 설계·개발 · AI-native 워크플로우(Claude Code 상시 활용)
