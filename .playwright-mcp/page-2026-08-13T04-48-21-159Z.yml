      - generic [ref=f22e962]:
        - generic [ref=f22e965]:
          - paragraph [ref=f22e971]:
            - generic [ref=f22e972]: Testimonials
          - heading "Check what the best marketers say about Peec AI." [level=2] [ref=f22e975]
        - generic [ref=f22e976]:
          - generic [ref=f22e977]:
            - generic [ref=f22e983]:
              - paragraph [ref=f22e985]: Peec AI offers key insights on AI visibility, helping brands stay at the forefront of discovery in the age of AI and generative search. As ChatGPT, Perplexity, and Deepseek drive traffic and conversions, Peec.ai measures the growth.
              - generic [ref=f22e990]:
                - paragraph [ref=f22e992]: Crystal Carter
                - paragraph [ref=f22e994]: Head of SEO Comms
            - generic [ref=f22e1000]:
              - paragraph [ref=f22e1002]: Peec allows us to pinpoint the exact types of content that are surfaced in specific LLMs. With that visibility, we’ve been able to prioritize our content strategy and drive a 5x year-over-year increase in traffic and demo requests from LLMs.
              - generic [ref=f22e1007]:
                - paragraph [ref=f22e1009]: Jon Gitlin
                - paragraph [ref=f22e1011]: SEO Strategist
          - generic [ref=f22e1016]:
            - generic [ref=f22e1022]:
              - paragraph [ref=f22e1024]: Peec avoids the issues we see with other SEO/AEO platforms, where there’s often an overload of features and information that isn't of primary importance. It keeps things simple - set up your prompts, see your AI visibility, and act on top citations.
              - generic [ref=f22e1029]:
                - paragraph [ref=f22e1031]: Ethan Smith
                - paragraph [ref=f22e1033]: CEO
            - generic [ref=f22e1039]:
              - paragraph [ref=f22e1041]: Peec AI gave us a data-informed view of our LLMO strategy at Glide - virtually overnight. With its insights, our blog posts started ranking for targeted ChatGPT and Perplexity prompts within 24 hours. I am really impressed with the platform, and the exceptional support from the team.
              - generic [ref=f22e1046]:
                - paragraph [ref=f22e1048]: Sepy Bazzazi
                - paragraph [ref=f22e1050]: Head of Marketing
          - generic [ref=f22e1055]:
            - generic [ref=f22e1061]:
              - paragraph [ref=f22e1063]: Peec AI helps us identify what's being cited, adjust our strategy in real-time, and stay ahead of a rapidly evolving search landscape. For our team, the clarity and simplicity of the platform is invaluable when making strategic content decisions.
              - generic [ref=f22e1068]:
                - paragraph [ref=f22e1070]: Thomas Smeaton
                - paragraph [ref=f22e1072]: SEO Manager
            - generic [ref=f22e1078]:
              - paragraph [ref=f22e1080]: As search marketers, our decisions should always be driven by data. Peec AI provides exactly the critical insights we need to stay competitive in the ever-evolving world of search.
              - generic [ref=f22e1085]:
                - paragraph [ref=f22e1087]: Artur Kosch
                - paragraph [ref=f22e1089]: General Manager
      - generic [ref=f22e1094]:
        - generic [ref=f22e1097]:
          - heading "FAQs" [level=2] [ref=f22e1099]
          - paragraph [ref=f22e1101]: Get answers to the most common questions about AI search and Peec AI.
        - generic [ref=f22e1105]:
          - generic [ref=f22e1106]:
            - button "What are AI answers?" [ref=f22e1107] [cursor=pointer]
            - generic: "AI answers are the individual AI search results we track across platforms. It represents one chat result per model. Example: If you are running 25 prompts across 3 models for 30 days, we would analyze 25x3x30 = 2250 AI answers."
          - generic [ref=f22e1113]:
            - button "Can i track multiple sub-brands?" [ref=f22e1114] [cursor=pointer]
            - generic: Yes. You can set up and monitor multiple sub-brands within your account, ensuring each gets its own visibility tracking. Agency accounts have this per default. Schedule a call with us to set it up for your brand as well.
          - generic [ref=f22e1120]:
            - button "Can I split the amount of prompts across multiple projects or brands?" [ref=f22e1121] [cursor=pointer]
            - generic: Prompts can be shared across your account, allowing you to allocate it to different projects or brands as needed.
          - generic [ref=f22e1127]:
            - button "Can the prompt amount be adjusted?" [ref=f22e1128] [cursor=pointer]
            - generic: Yes. You can upgrade or adjust your prompt volume at any time to match your usage and growth.
          - generic [ref=f22e1134]:
            - button "What determines the pricing?" [ref=f22e1135] [cursor=pointer]
            - generic: Pricing is based on the number of tracked prompts and models analyzed. Higher tiers get discounts on price per prompt and a dedicated support function.
          - generic [ref=f22e1141]:
            - button "How does pricing work for multiple countries/languages?" [ref=f22e1142] [cursor=pointer]
            - generic: You can track queries across any supported country or language with no additional cost. Pricing remains tied to usage of prompts, not the number of regions or languages.
          - generic [ref=f22e1148]:
            - button "Is there a yearly discount?" [ref=f22e1149] [cursor=pointer]
            - generic: We offer a 15% discount for customers who choose annual billing.
          - generic [ref=f22e1155]:
            - button "How do agency bundles work if we mange several clients?" [ref=f22e1156] [cursor=pointer]
            - generic: Agencies can manage multiple client projects under one bundle, with centralized billing and flexible prompt allocation.
