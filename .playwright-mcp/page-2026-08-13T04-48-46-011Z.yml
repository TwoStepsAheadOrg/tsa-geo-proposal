      - generic [ref=f49e965]:
        - generic [ref=f49e968]:
          - heading "FAQs" [level=2] [ref=f49e970]
          - paragraph [ref=f49e972]: Get answers to the most common questions about AI search and Peec AI.
        - generic [ref=f49e976]:
          - generic [ref=f49e977]:
            - button "What are credits?" [ref=f49e978] [cursor=pointer]
            - generic: Credits are allocation slots that determine how many prompts you can track, across how many AI models, and at what frequency. They don't get spent or consumed. They stay allocated to a project until you change it.
          - generic [ref=f49e984]:
            - button "How are credits calculated?" [ref=f49e985] [cursor=pointer]
            - generic: 1 prompt x 1 model x 1 day = 1 credit. Running one prompt against one model for a full month costs 30 credits. Most of our customers track three models, so you can calculate with 90 credits per prompt per month.
          - generic [ref=f49e991]:
            - button "Can i split credits across multiple clients or projects?" [ref=f49e992] [cursor=pointer]
            - generic: Yes. Your credit pool is shared across all projects. You decide how much each client gets and can reallocate anytime by adjusting prompts or models at the project level.
          - generic [ref=f49e998]:
            - button "Do credits reset monthly?" [ref=f49e999] [cursor=pointer]
            - generic: No. Credits are allocation slots, not a monthly budget. Your allocations stay in place until you change them. There's no reset or expiry.
          - generic [ref=f49e1005]:
            - button "Is there a minimum per project?" [ref=f49e1006] [cursor=pointer]
            - generic: The minimum allocation per project is 900 credits. This equals 10 prompts across 3 models or 30 prompts on one.
          - generic [ref=f49e1012]:
            - button "What happens if I run out of available credits?" [ref=f49e1013] [cursor=pointer]
            - generic: You can always upgrade to a higher plan to receive more credits. We also offer add-ons if you're in between plans and need more credits. You can also free up credits by adjusting the models or prompt limit as long as your active prompts remain under the limit.
          - generic [ref=f49e1019]:
            - button "Can I change which AI models I track per project?" [ref=f49e1020] [cursor=pointer]
            - generic: Yes, you can decide which models and how many to track at the project level. Adding or removing models will automatically adjust the credits assigned to that project.
          - generic [ref=f49e1026]:
            - button "Is there a discount for annual billing?" [ref=f49e1027] [cursor=pointer]
            - generic: Yes. All plans save ~15% when billed annually.
          - generic [ref=f49e1033]:
            - button "How do upgrades and downgrades work?" [ref=f49e1034] [cursor=pointer]
            - generic: Upgrades are prorated by day so you only pay for what you use. Downgrades take effect at the end of your billing cycle. Your project data stays intact either way.
      - generic [ref=f49e1044]:
        - generic [ref=f49e1045]:
          - generic [ref=f49e1046]:
            - heading "We’ve raised $29m in capital from top-tier investors, and are in the top 1% of startups in terms of growth." [level=4] [ref=f49e1048]
            - paragraph [ref=f49e1050]: AI search is replacing traditional search, and we’re building the leading marketing engine for this platform shift.
          - link [ref=f49e1054] [cursor=pointer]:
            - /url: ./careers
            - paragraph [ref=f49e1057]: We are hiring →
        - paragraph [ref=f49e1071]: Come build, learn, and grow with us — a high-energy team in Berlin that’s redefining how brands show up in AI search.
      - generic [ref=f49e1081]:
        - generic [ref=f49e1084]:
          - paragraph [ref=f49e1090]:
            - generic [ref=f49e1091]: Testimonials
          - heading "Check what the best marketers say about Peec AI" [level=2] [ref=f49e1094]
        - generic [ref=f49e1095]:
          - generic [ref=f49e1096]:
            - generic [ref=f49e1102]:
              - paragraph [ref=f49e1104]: Peec AI offers key insights on AI visibility, helping brands stay at the forefront of discovery in the age of AI and generative search. As ChatGPT, Perplexity, and Deepseek drive traffic and conversions, Peec.ai measures the growth.
              - generic [ref=f49e1109]:
                - paragraph [ref=f49e1111]: Crystal Carter
                - paragraph [ref=f49e1113]: Head of SEO Comms
            - generic [ref=f49e1119]:
              - paragraph [ref=f49e1121]: Peec allows us to pinpoint the exact types of content that are surfaced in specific LLMs. With that visibility, we’ve been able to prioritize our content strategy and drive a 5x year-over-year increase in traffic and demo requests from LLMs.
              - generic [ref=f49e1126]:
                - paragraph [ref=f49e1128]: Jon Gitlin
                - paragraph [ref=f49e1130]: SEO Strategist
          - generic [ref=f49e1135]:
            - generic [ref=f49e1141]:
              - paragraph [ref=f49e1143]: Peec avoids the issues we see with other SEO/AEO platforms, where there’s often an overload of features and information that isn't of primary importance. It keeps things simple - set up your prompts, see your AI visibility, and act on top citations.
              - generic [ref=f49e1148]:
                - paragraph [ref=f49e1150]: Ethan Smith
                - paragraph [ref=f49e1152]: CEO
            - generic [ref=f49e1158]:
              - paragraph [ref=f49e1160]: Peec AI gave us a data-informed view of our LLMO strategy at Glide - virtually overnight. With its insights, our blog posts started ranking for targeted ChatGPT and Perplexity prompts within 24 hours. I am really impressed with the platform, and the exceptional support from the team.
              - generic [ref=f49e1165]:
                - paragraph [ref=f49e1167]: Sepy Bazzazi
                - paragraph [ref=f49e1169]: Head of Marketing
          - generic [ref=f49e1174]:
            - generic [ref=f49e1180]:
              - paragraph [ref=f49e1182]: Peec AI helps us identify what's being cited, adjust our strategy in real-time, and stay ahead of a rapidly evolving search landscape. For our team, the clarity and simplicity of the platform is invaluable when making strategic content decisions.
              - generic [ref=f49e1187]:
                - paragraph [ref=f49e1189]: Thomas Smeaton
                - paragraph [ref=f49e1191]: SEO Manager
            - generic [ref=f49e1197]:
              - paragraph [ref=f49e1199]: As search marketers, our decisions should always be driven by data. Peec AI provides exactly the critical insights we need to stay competitive in the ever-evolving world of search.
              - generic [ref=f49e1204]:
                - paragraph [ref=f49e1206]: Artur Kosch
                - paragraph [ref=f49e1208]: General Manager
        - generic [ref=f49e1218]:
          - heading "Find out what AI says about your brand" [level=3] [ref=f49e1220]
