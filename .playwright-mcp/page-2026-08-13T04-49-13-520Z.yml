      - generic [ref=f82e1985]:
        - generic [ref=f82e1988]:
          - heading "FAQs" [level=2] [ref=f82e1990]
          - paragraph [ref=f82e1992]: Get answers to the most common questions about AI search and Peec AI.
        - generic [ref=f82e1996]:
          - generic [ref=f82e1997]:
            - button "How do I get started with Peec AI?" [ref=f82e1998] [cursor=pointer]
            - generic: Peec AI walks you through setting up a workspace with your brand nameand domain, then suggests prompts matched to real customer searchintent. Within a few minutes, your dashboard shows your firstAI visibility scores - a breakdown per engine so you see where yourbrand already appears and where it doesn't.
          - generic [ref=f82e2004]:
            - button "Can I segment visibility by model, region, or audience?" [ref=f82e2005] [cursor=pointer]
            - generic: "Yes: you can filter your AI visiblity data by model, country, and prompt tags - each prompt can carry tags for the personas or funnel stage. This lets you compare performance across any segment, for instance US vs UK traffic, awareness vs purchase-intent prompts, or even a specific model like ChatGPT vs Gemini."
          - generic [ref=f82e2011]:
            - button "How often is the data refreshed?" [ref=f82e2012] [cursor=pointer]
            - generic: Peec AI executes each prompt once every 24 hours on every AI model you'veselected. This daily cadence gives you apples-to-apples trend dataacross dates, models, and regions.
          - generic [ref=f82e2018]:
            - button "What are brand visibility vs. source visibility metrics?" [ref=f82e2019] [cursor=pointer]
            - generic: A brand mention happens when an AI answer directly names your brand.A source citation happens when your website or content is used togenerate an answer - even if your brand isn't named. Tracking bothtells you if AI trusts your content as a source, and whether it recommends your brand.
          - generic [ref=f82e2025]:
            - button "How do source citations work behind the scenes?" [ref=f82e2026] [cursor=pointer]
            - generic: Peec AI tracks both “used” (your content informed the AI’s answer) and “cited” (your URL is explicitly mentioned). You can view source usage at domain or URL levels - complete with citation frequency.
          - generic [ref=f82e2032]:
            - button "How do I integrate Peec AI into my BI/reporting tools?" [ref=f82e2033] [cursor=pointer]
            - generic: "Peec AI allows you to integrate your BI stack through three channels: the Google Looker Studio connector for drag-and-drop dashboards, the REST API for custom data pipelines, or the Model Context Protocol (MCP) to feed visibility data directly into AI agents such as Claude. All three stream live visibility, source tracking, and multi-project metrics in real time."
