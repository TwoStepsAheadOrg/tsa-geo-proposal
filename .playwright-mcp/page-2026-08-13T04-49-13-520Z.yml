      - generic [ref=f82e1810]:
        - generic [ref=f82e1813]:
          - paragraph [ref=f82e1819]:
            - generic [ref=f82e1820]: Testimonials
          - heading "Check what the best marketers say about Peec AI." [level=2] [ref=f82e1823]
        - generic [ref=f82e1824]:
          - generic [ref=f82e1825]:
            - generic [ref=f82e1831]:
              - paragraph [ref=f82e1833]: Peec AI offers key insights on AI visibility, helping brands stay at the forefront of discovery in the age of AI and generative search. As ChatGPT, Perplexity, and Deepseek drive traffic and conversions, Peec.ai measures the growth.
              - generic [ref=f82e1838]:
                - paragraph [ref=f82e1840]: Crystal Carter
                - paragraph [ref=f82e1842]: Head of SEO Comms
            - generic [ref=f82e1848]:
              - paragraph [ref=f82e1850]: Peec allows us to pinpoint the exact types of content that are surfaced in specific LLMs. With that visibility, we’ve been able to prioritize our content strategy and drive a 5x year-over-year increase in traffic and demo requests from LLMs.
              - generic [ref=f82e1855]:
                - paragraph [ref=f82e1857]: Jon Gitlin
                - paragraph [ref=f82e1859]: SEO Strategist
          - generic [ref=f82e1864]:
            - generic [ref=f82e1870]:
              - paragraph [ref=f82e1872]: Peec avoids the issues we see with other SEO/AEO platforms, where there’s often an overload of features and information that isn't of primary importance. It keeps things simple - set up your prompts, see your AI visibility, and act on top citations.
              - generic [ref=f82e1877]:
                - paragraph [ref=f82e1879]: Ethan Smith
                - paragraph [ref=f82e1881]: CEO
            - generic [ref=f82e1887]:
              - paragraph [ref=f82e1889]: Peec AI gave us a data-informed view of our LLMO strategy at Glide - virtually overnight. With its insights, our blog posts started ranking for targeted ChatGPT and Perplexity prompts within 24 hours. I am really impressed with the platform, and the exceptional support from the team.
              - generic [ref=f82e1894]:
                - paragraph [ref=f82e1896]: Sepy Bazzazi
                - paragraph [ref=f82e1898]: Head of Marketing
          - generic [ref=f82e1903]:
            - generic [ref=f82e1909]:
              - paragraph [ref=f82e1911]: Peec AI helps us identify what's being cited, adjust our strategy in real-time, and stay ahead of a rapidly evolving search landscape. For our team, the clarity and simplicity of the platform is invaluable when making strategic content decisions.
              - generic [ref=f82e1916]:
                - paragraph [ref=f82e1918]: Thomas Smeaton
                - paragraph [ref=f82e1920]: SEO Manager
            - generic [ref=f82e1926]:
              - paragraph [ref=f82e1928]: As search marketers, our decisions should always be driven by data. Peec AI provides exactly the critical insights we need to stay competitive in the ever-evolving world of search.
              - generic [ref=f82e1933]:
                - paragraph [ref=f82e1935]: Artur Kosch
                - paragraph [ref=f82e1937]: General Manager
        - generic [ref=f82e1947]:
          - heading "Find out what AI says about your brand" [level=3] [ref=f82e1949]
          - generic [ref=f82e1950]:
            - link [ref=f82e1954] [cursor=pointer]:
              - /url: https://app.peec.ai/?comet_token_override=35058540853762385484637804622348241143951441802
